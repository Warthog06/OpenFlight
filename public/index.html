<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>OpenFlight</title>
  <meta name="description" content="Free, open-source live flight radar on OpenStreetMap with 3D altitude view and replay.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f5b301' d='M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
      <span>OpenFlight</span>
    </div>
    <div class="search">
      <input id="search" type="search" placeholder="Callsign, registration or hex" autocomplete="off" spellcheck="false">
      <ul id="search-results" hidden></ul>
    </div>
    <div class="status">
      <span id="mode-badge" class="badge live">LIVE</span>
      <span id="count" title="Aircraft on screen">0</span>
      <span id="source" class="muted"></span>
    </div>
  </header>

  <div id="controls" class="controls">
    <button id="btn-opts" class="ctl" title="Map options">
      <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5zm-7.6 8.2L2 12.4l10 5 10-5-2.4-1.2L12 15l-7.6-3.8zm0 4.4L2 16.8l10 5 10-5-2.4-1.2L12 19.4l-7.6-3.8z" stroke="none"/></svg>
    </button>
    <button id="btn-3d" class="ctl" title="Toggle 3D view (shows altitude)">3D</button>
    <button id="btn-locate" class="ctl" title="Go to my location">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-width="2"/><circle cx="12" cy="12" r="7" fill="none" stroke-width="2"/></svg>
    </button>
    <div class="ctl-group">
      <label class="toggle"><input id="opt-trails" type="checkbox" checked> Trails</label>
      <label class="toggle"><input id="opt-labels" type="checkbox" checked> Labels</label>
      <label class="toggle"><input id="opt-ground" type="checkbox" checked> On ground</label>
      <label id="exag-wrap" class="slider" hidden>
        <span>Altitude ×<b id="exag-val">4</b></span>
        <input id="opt-exag" type="range" min="1" max="12" step="1" value="4">
      </label>
    </div>
  </div>

  <aside id="panel" class="panel" hidden>
    <button id="panel-close" class="close" title="Close">&times;</button>
    <div class="p-head">
      <h2 id="p-callsign">—</h2>
      <div id="p-sub" class="muted"></div>
    </div>
    <div id="p-route" class="route" hidden></div>
    <dl class="grid">
      <div><dt>Altitude</dt><dd id="p-alt">—</dd></div>
      <div><dt>Vertical rate</dt><dd id="p-vr">—</dd></div>
      <div><dt>Ground speed</dt><dd id="p-gs">—</dd></div>
      <div><dt>Track</dt><dd id="p-trk">—</dd></div>
      <div><dt>Registration</dt><dd id="p-reg">—</dd></div>
      <div><dt>Type</dt><dd id="p-type">—</dd></div>
      <div><dt>Squawk</dt><dd id="p-sq">—</dd></div>
      <div><dt>ICAO hex</dt><dd id="p-hex">—</dd></div>
      <div><dt>Position</dt><dd id="p-pos">—</dd></div>
      <div><dt>Last seen</dt><dd id="p-seen">—</dd></div>
    </dl>
    <div class="p-actions">
      <button id="p-follow" class="btn">Follow</button>
      <a id="p-ext" class="btn ghost" target="_blank" rel="noopener">Open on adsb.lol ↗</a>
    </div>
  </aside>

  <div class="legend" title="Altitude colours">
    <div class="legend-bar"></div>
    <div class="legend-labels"><span>0</span><span>10k</span><span>20k</span><span>30k</span><span>40k ft</span></div>
  </div>

  <footer class="timebar">
    <button id="btn-live" class="btn live-btn" title="Back to live">● Live</button>
    <div class="clock">
      <div id="clock-main">--:--:--</div>
      <div id="clock-sub" class="muted">UTC</div>
    </div>
    <div class="when">
      <input id="dt" type="datetime-local" step="1" title="Pick a date and time (your local time)">
      <button id="btn-go" class="btn">Go</button>
    </div>
    <div class="transport">
      <button class="btn icon" data-step="-300" title="Back 5 minutes">−5m</button>
      <button class="btn icon" data-step="-60" title="Back 1 minute">−1m</button>
      <button id="btn-play" class="btn icon play" title="Play / pause">❚❚</button>
      <button class="btn icon" data-step="60" title="Forward 1 minute">+1m</button>
      <button class="btn icon" data-step="300" title="Forward 5 minutes">+5m</button>
      <select id="speed" title="Playback speed">
        <option value="1">1×</option><option value="2">2×</option><option value="5">5×</option>
        <option value="10">10×</option><option value="30">30×</option><option value="60">60×</option>
      </select>
    </div>
    <div id="coverage" class="coverage muted"></div>
  </footer>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
  <script src="vendor/deck.gl/deck.gl.min.js"></script>
  <script src="plane-model.js"></script>
  <script src="app.js"></script>
</body>
</html>
